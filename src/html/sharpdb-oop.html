<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharpDB V2 — OOP Design</title>
<script>
(function(){var s=localStorage.getItem('theme');var d=s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',d);document.documentElement.setAttribute('data-theme',d?'dark':'light');})();
</script>
<style>
:root{
  --bg:#F6F8FB;--surface:#FFFFFF;--surface2:#EDF1F7;
  --ink:#0F172A;--body:#334155;--muted:#64748B;
  --line:#CBD5E1;--line-soft:#E2E8F0;
  --clay:#0D9488;--clay-soft:rgba(13,148,136,0.10);
  --olive:#7C3AED;--olive-soft:rgba(124,58,237,0.10);
  --gold:#D97706;--blue:#3B82F6;
  --zone:rgba(15,23,42,0.025);--zone-line:#CBD5E1;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{--bg:#F6F8FB;--surface:#FFFFFF;--surface2:#EDF1F7;--ink:#0F172A;--body:#334155;--muted:#64748B;--line:#CBD5E1;--line-soft:#E2E8F0;--clay:#0D9488;--clay-soft:rgba(13,148,136,0.10);--olive:#7C3AED;--olive-soft:rgba(124,58,237,0.10);--gold:#D97706;--blue:#3B82F6;--zone:rgba(15,23,42,0.025);--zone-line:#CBD5E1;}
html.dark,:root[data-theme="dark"]{--bg:#080D17;--surface:#111827;--surface2:#1A2438;--ink:#F1F5F9;--body:#CBD5E1;--muted:#64748B;--line:#1E2D42;--line-soft:#111827;--clay:#2DD4BF;--clay-soft:rgba(45,212,191,0.12);--olive:#A78BFA;--olive-soft:rgba(167,139,250,0.12);--gold:#FCD34D;--blue:#60A5FA;--zone:rgba(241,245,249,0.03);--zone-line:#1E2D42;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line-soft);flex:none;}
.bar h1{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink);letter-spacing:-0.01em;}
.bar .sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.spacer{flex:1;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:0.04em;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s ease;}
.chip:hover{color:var(--ink);border-color:var(--muted);}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
#themeToggle{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;}
#themeToggle:hover{color:var(--ink);border-color:var(--muted);}
.stage{flex:1;position:relative;min-height:0;overflow:hidden;}
.tab-svg{position:absolute;inset:0;width:100%;height:100%;display:none;}
.tab-svg.active{display:block;}

/* UML node base */
.un{cursor:default;}
.un rect{fill:var(--surface);stroke:var(--line);stroke-width:1.4;transition:stroke .12s;}
.un:hover rect{stroke:var(--clay);stroke-width:1.8;}
.un.iface rect{fill:var(--clay-soft);stroke:var(--clay);}
.un.infra rect{fill:var(--olive-soft);stroke:var(--olive);}
.un.vtype rect{fill:var(--surface2);stroke:var(--line);stroke-dasharray:5 3;}
.un.v1 rect{fill:var(--surface2);stroke:var(--gold);}
/* text */
.stereo{font-family:var(--mono);font-size:9px;fill:var(--clay);pointer-events:none;font-style:italic;}
.stereo-o{font-family:var(--mono);font-size:9px;fill:var(--olive);pointer-events:none;font-style:italic;}
.stereo-g{font-family:var(--mono);font-size:9px;fill:var(--gold);pointer-events:none;}
.uname{font-family:var(--sans);font-size:12px;font-weight:700;fill:var(--ink);pointer-events:none;}
.member{font-family:var(--mono);font-size:9.5px;fill:var(--body);pointer-events:none;}
.prop{font-family:var(--mono);font-size:9.5px;fill:var(--blue);pointer-events:none;}
.dv{stroke:var(--line);stroke-width:1;}
/* zones */
.zbg{fill:var(--zone);stroke:var(--zone-line);stroke-width:1;stroke-dasharray:4 4;}
.zlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;fill:var(--muted);}
/* relationships */
.rx{stroke:var(--body);stroke-width:1.4;fill:none;marker-end:url(#m-ext);}
.ri{stroke:var(--clay);stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#m-impl);}
.rd{stroke:var(--muted);stroke-width:1.1;fill:none;stroke-dasharray:3 3;marker-end:url(#m-dep);}
.rl{font-family:var(--mono);font-size:9px;fill:var(--muted);}
/* legend */
.lgnd text{font-family:var(--mono);font-size:9px;fill:var(--muted);}

@media(max-width:800px){body{overflow:auto;}.stage{min-height:70vh;}}
</style>
</head>
<body>
<div class="bar">
  <div><h1>SharpDB V2 — OOP Design</h1><div class="sub">interfaces · implementations · relationships</div></div>
  <div class="spacer"></div>
  <div class="chips" id="chips">
    <button class="chip on" data-tab="index">Index</button>
    <button class="chip" data-tab="storage">Storage</button>
    <button class="chip" data-tab="txn">Transactions</button>
    <button class="chip" data-tab="wal">WAL + Schema</button>
    <button class="chip" data-tab="api">Public API</button>
  </div>
  <button id="themeToggle">Theme</button>
</div>

<script>
function showTab(id){
  document.querySelectorAll('.tab-svg').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('tab-'+id);
  if(el)el.classList.add('active');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.tab===id));
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>showTab(c.dataset.tab)));

document.getElementById('themeToggle').addEventListener('click',()=>{
  const dark=!document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark',dark);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  localStorage.setItem('theme',dark?'dark':'light');
});
</script>
